events {
    # worker_connections defines how many simultaneous connections each worker can handle.
    worker_connections 1024;
}

http {
    # -------------------------------------------------
    # The "Upstream" Block: Defines the pool of servers
    # -------------------------------------------------
    upstream backend_pool {
        # "least_conn" means Nginx sends traffic to the server with the fewest active connections.
        least_conn;

        # 'node-app' is the service name from docker-compose.yml.
        # Docker automatically load-balances across all 3 containers when we point to 'node-app:3000'.
        server node-app:3000;
    }

    # -------------------------------------------------
    # The "Server" Block: Defines how to handle requests
    # -------------------------------------------------
    server {
        # Listen on port 80 (standard HTTP port)
        listen 80;

        # Proxy all incoming traffic to our upstream pool
        location / {
            proxy_pass http://backend_pool;
            
            # These headers are necessary to pass the real client IP address
            # to the Node.js application (so your logs show the real user IP).
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for WebSockets (if you ever add real-time chat)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}

version: '3.8'

services:
  # =============================================
  # 1. MYSQL DATABASE
  # =============================================
  mysql:
    image: mysql:8.0
    container_name: autodeal-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_NAME:-pre_owned_cars}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      # ⚠️ CAVEAT: Only map this for local development. For production, remove this port mapping!
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  # =============================================
  # 2. REDIS CACHE
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: autodeal-cache
    ports:
      # ⚠️ CAVEAT: Only map this for local development. For production, remove this port mapping!
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================
  # 3. NODE.JS APPLICATION API
  # =============================================
  node-app:
    build: .
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Connect using the service name 'mysql' and 'redis'
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_NAME=${DB_NAME:-pre_owned_cars}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-super_secret}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      # Horizontal scaling: run 3 instances of our Node app
      mode: replicated
      replicas: 3
    restart: unless-stopped

  # =============================================
  # 4. NGINX LOAD BALANCER
  # =============================================
  nginx:
    image: nginx:alpine
    container_name: autodeal-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node-app
    restart: unless-stopped

  # =============================================
  # 5. PHPMYADMIN (Database GUI — dev only)
  # =============================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: autodeal-phpmyadmin
    ports:
      # Access at: http://localhost:8080
      # ⚠️ CAVEAT: Remove this service before deploying to production!
      - "8080:80"
    environment:
      # PMA_HOST must match the service name 'mysql' in this compose file.
      # Docker's internal DNS resolves this to the mysql container's IP.
      PMA_HOST: mysql
      PMA_PORT: 3306
      # Pre-fill the username so you just need to enter your password on login
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data:

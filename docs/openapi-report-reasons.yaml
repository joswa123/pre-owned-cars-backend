openapi: 3.0.3
info:
  title: AutoDeal4U - Report Reasons API
  version: 1.0.0
  description: Public and Admin API specifications for managing car listing report reasons.
servers:
  - url: /api/v1
    description: v1 Base URL
  - url: /api
    description: Root API Base URL

paths:
  /report-reasons:
    get:
      summary: Public - Get Active Report Reasons
      description: Returns only active report reasons for frontend dropdowns, sorted by sort_order ASC, then label ASC.
      operationId: getPublicReportReasons
      tags:
        - Report Reasons (Public)
      responses:
        '200':
          description: List of active report reasons
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Report reasons fetched successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicReportReason'
              example:
                success: true
                message: Report reasons fetched successfully
                data:
                  - id: "05b663e4-6901-45ca-afaa-06a187f67e53"
                    label: "Car Sold Out"
                    value: "car_sold_out"
                  - id: "3579c8f4-ffed-4751-9ec9-5cea863e82bd"
                    label: "Overpriced Car"
                    value: "overpriced_car"

  /admin/report-reasons:
    get:
      summary: Admin - List All Report Reasons
      description: Returns paginated list of all report reasons (active and inactive) with optional search and filter.
      operationId: getAllReportReasonsAdmin
      tags:
        - Report Reasons (Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          description: Search term matching label or value
          required: false
          schema:
            type: string
        - name: isActive
          in: query
          description: Filter by active status
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Successfully retrieved report reasons
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Report reasons retrieved successfully
                  data:
                    type: object
                    properties:
                      reasons:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminReportReason'
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Admin - Create Report Reason
      description: Creates a new report reason. Value must be unique and in lowercase snake_case.
      operationId: createReportReasonAdmin
      tags:
        - Report Reasons (Admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportReasonInput'
      responses:
        '201':
          description: Report reason created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Report reason created successfully
                  data:
                    type: object
                    properties:
                      reason:
                        $ref: '#/components/schemas/AdminReportReason'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/report-reasons/{id}:
    get:
      summary: Admin - Get Report Reason by ID
      description: Returns full record of a report reason.
      operationId: getReportReasonByIdAdmin
      tags:
        - Report Reasons (Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the report reason
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report reason details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Report reason retrieved successfully
                  data:
                    type: object
                    properties:
                      reason:
                        $ref: '#/components/schemas/AdminReportReason'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Admin - Update Report Reason
      description: Partially updates an existing report reason. Value must remain unique.
      operationId: updateReportReasonAdmin
      tags:
        - Report Reasons (Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the report reason
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReportReasonInput'
      responses:
        '200':
          description: Report reason updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Report reason updated successfully
                  data:
                    type: object
                    properties:
                      reason:
                        $ref: '#/components/schemas/AdminReportReason'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Admin - Delete Report Reason
      description: Deletes an existing report reason. Deletion is blocked with 400 if any existing car report references this reason.
      operationId: deleteReportReasonAdmin
      tags:
        - Report Reasons (Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the report reason
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report reason deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Report reason deleted successfully
        '400':
          description: Cannot delete because reason is referenced by existing car reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Cannot delete report reason because it is referenced by existing car reports. Consider deactivating it instead.
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PublicReportReason:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          example: Car Sold Out
        value:
          type: string
          example: car_sold_out

    AdminReportReason:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          example: Car Sold Out
        value:
          type: string
          example: car_sold_out
        isActive:
          type: boolean
          example: true
        sortOrder:
          type: integer
          example: 0
        description:
          type: string
          nullable: true
          example: Car is no longer available/sold
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateReportReasonInput:
      type: object
      required:
        - label
        - value
      properties:
        label:
          type: string
          maxLength: 100
          example: Suspicious Odometer
        value:
          type: string
          maxLength: 60
          pattern: '^[a-z0-9]+(_[a-z0-9]+)*$'
          example: suspicious_odometer
        isActive:
          type: boolean
          default: true
        sortOrder:
          type: integer
          minimum: 0
          default: 0
        description:
          type: string
          maxLength: 500
          example: Odometer tampering suspected by user

    UpdateReportReasonInput:
      type: object
      properties:
        label:
          type: string
          maxLength: 100
        value:
          type: string
          maxLength: 60
          pattern: '^[a-z0-9]+(_[a-z0-9]+)*$'
        isActive:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
        description:
          type: string
          maxLength: 500

  responses:
    BadRequest:
      description: Validation error or duplicate value
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Value already exists
              errors:
                type: object

    Unauthorized:
      description: Authentication token missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Authentication required

    Forbidden:
      description: User lacks admin role
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Forbidden: Admin access required

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Report reason not found.
